name: celechron
description: Android course and time planner for Zhejiang University students.
publish_to: none
version: 0.1.5+7
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.11
  flutter_math_fork: ^0.7.4
  flutter_svg: ^2.3.0
  markdown: ^7.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  path_provider: ^2.1.5
  share_plus: ^12.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/styles/
    - assets/branding/eclipse.svg
